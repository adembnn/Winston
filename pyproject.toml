[project]
name = "enquete"
version = "0.1.0"
description = "Outil d'enquête OSINT pour rédaction : vidéos sociales, sources ouvertes, liens prouvés."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Archivage des preuves sans compte : capture de page (puis `playwright install chromium`)
# et usurpation de navigateur pour yt-dlp (yt-dlp n'accepte que curl_cffi 0.10 à 0.16).
archive = ["playwright>=1.40", "curl_cffi>=0.10,<0.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
