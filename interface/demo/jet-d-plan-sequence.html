<body>
<!--
THESIS: l'enquête est un seul plan continu de documentaire. On ne change jamais d'écran : la caméra voyage dans le noir, le long des fils, de la question vers un rôle, puis une pièce, puis la preuve.
OWN-WORLD: un plateau noir à grain de pellicule, des cadres blancs qui changent d'échelle et de netteté selon la profondeur, des étiquettes blanches à texte noir à taille d'écran fixe.
STORY: Stylos minceur, cas fictif. 47 vidéos répètent la même phrase, elles remontent à 6 sources, 3 zones d'ombre restent à creuser.
FIRST VIEWPORT: la question en intertitre blanc, au centre, seule dans le noir ; le compteur « 3 zones d'ombre » dessous ; les fils poussent vers les rôles.
FORM: plan-séquence en projection perspective maison (translation et échelle seulement, un axe dominant), clé de tirage 0faf8ac0.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->

<script>
(()=>{
'use strict';
const F=1000;
const de=document.documentElement;
let W=de.clientWidth,H=de.clientHeight,u=1,CY=H/2,BAND=100;
const $=s=>document.querySelector(s);
const qEl=$('#q'),itemsEl=$('#items'),labsEl=$('#labs'),wiresEl=$('#wires');
const NS='http://www.w3.org/2000/svg';
function size(){W=de.clientWidth||innerWidth;H=de.clientHeight||innerHeight;u=Math.max(.55,Math.min(W/1440,H/900,(H-100)/790,2.4));BAND=Math.max(100,104*u);CY=(56*u+H-BAND)/2;document.documentElement.style.setProperty('--u',u)}
size();

/* grain de pellicule : bruit généré une fois, déplacé par à-coups */
(()=>{const c=$('#grain-src'),x=c.getContext('2d'),d=x.createImageData(256,256);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
  x.putImageData(d,0,0);const g=$('#grain');g.style.backgroundImage='url('+c.toDataURL()+')';
  setInterval(()=>{g.style.backgroundPosition=(Math.random()*256|0)+'px '+(Math.random()*256|0)+'px'},110)})();

/* pictogrammes de plateforme, dessinés */
const IC={
 tiktok:'<svg viewBox="0 0 20 20"><path d="M11 2v10.2a3.2 3.2 0 1 1-3.2-3.2" fill="none" stroke="#080808" stroke-width="2.4"/><path d="M11 2c.3 2.4 1.9 3.9 4.2 4.1" fill="none" stroke="#080808" stroke-width="2.4"/></svg>',

const NOM={n0:'niveau0',n1:'niveau1',n2g:'niveau2',n2:'niveau2',role:'piece',zone:'zone',proof:'preuve'};
function emitEtat(name,detail){const nom=NOM[name];if(!nom||(nom===lastNom&&!detail))return;
 const depuis=lastNom;lastNom=nom;document.dispatchEvent(new CustomEvent('etat',{detail:Object.assign({nom,depuis},detail||{})}))}
function go(name,arg,instant,force){
 if(!instant&&!force&&cur.name===name&&cur.arg===arg)return;
 const prev=cur.name;cur={name,arg};const sp=spec(name,arg);S=sp;
 selfHash='#'+(name==='n0'?'niveau0':name==='n1'?'niveau1':name==='proof'?'preuve':name==='role'?'dossier-'+arg:name==='zone'?'zone-'+arg:'niveau2');
 location.replace(selfHash);
 hideTip();
 emitEtat(name,name==='role'?{id:FRID[arg]}:name==='zone'?{id:arg}:null);
 snapshot();
 for(const id in wires){const w=wires[id];w.frozen=(!sp.wires[id]&&w.p>.01&&w.last&&(name==='n0'||name==='n1'))?w.last:null;if(!sp.wires[id]&&!w.frozen){w.p=0;w.fp=0}}
 order.forEach(it=>{const t=sp.it[it.id];it.tg=Object.assign({},{x:it.x,y:it.y,z:it.z,w:it.w,h:it.h,op:it.op,bl:it.bl,dim:it.dim},t);it.look=t.look||it.look;it.isSel=!!t.sel});
 /* niveau 2 : pas de trajet des vignettes, elles sont déjà sur leur pile (mouvement.js les fait arriver une à une) */
 if(name==='n2'&&prev==='n1'&&!instant){tiles.forEach(t=>{const it=items[t.id],g=it.tg;if(it.op<.5){for(const k of['x','y','z','w','h']){it[k]=g[k];it.f[k]=g[k]}}})}
 cam.tx=sp.cam.x;cam.ty=sp.cam.y;cam.tz=sp.cam.z;Q.ts=sp.q.size;Q.to=sp.q.op;
 // retards d'apparition (n0 -> n1) : les fils poussent un à un
 order.forEach(it=>it.delay=0);for(const id in wires)wires[id].delay=0;
 itemDur=760;maxDelay=0;
 if(prev==='n0'&&name==='n1'&&!instant){
  itemDur=820;
  roles.forEach((r,i)=>{const d=140*i;wires[r.id].delay=d;maxDelay=Math.max(maxDelay,d);
   const id=r.id==='amp'?'ampc':r.id;items[id].delay=d+180;if(r.id==='amp')tiles.forEach(t=>items[t.id].delay=d+180)});
  maxDelay+=180;
 }
 for(const id in wires){wires[id].tp=sp.wires[id]?1:0;wires[id].delay=wires[id].tp?wires[id].delay:0;wires[id].it=sp.wireIt[id]||(id==='amp'?'ampc':id)}
 t0=performance.now();
 if(instant){itemDur=0;maxDelay=0;finish(1)}else{moving=true;applyUI(sp,false)}
 clearTimeout(go.t);
 if(name==='n2g'&&!instant&&!new URLSearchParams(location.search).get('freeze'))go.t=setTimeout(()=>{if(cur.name==='n2g')go('n2')},1700+itemDur);
}
let S=null;
function finish(){
 order.forEach(it=>{const g=it.tg;for(const k in g)it[k]=g[k]});
 for(const k of['x','y','z'])cam[k]=cam['t'+k];Q.size=Q.ts;Q.op=Q.to;
 for(const id in wires){wires[id].p=wires[id].tp;wires[id].frozen=null}
 moving=false;applyUI(S,true);
 if(cur.name==='proof')proofT0=performance.now();
 if(pendingResize){pendingResize=false;go(cur.name,cur.arg,true)}
}
function lerp(a,b,t){return a+(b-a)*t}
function step(now){
 if(moving){
  const FZ=new URLSearchParams(location.search).get('freeze');
  const el=FZ?(+FZ)*(itemDur+maxDelay):now-t0;let done=!FZ&&el>=itemDur+maxDelay;
  const e=ease(Math.min(1,el/itemDur));
  for(const k of['x','y','z'])cam[k]=lerp(cam['f'+k],cam['t'+k],e);
  Q.size=lerp(Q.fs,Q.ts,e);Q.op=lerp(Q.fo,Q.to,Math.min(1,e*3));
  order.forEach(it=>{const t=Math.max(0,Math.min(1,(el-(it.delay||0))/itemDur)),e2=ease(t),f=it.f,g=it.tg;
   it.x=lerp(f.x,g.x,e2);it.y=lerp(f.y,g.y,e2);it.z=lerp(f.z,g.z,e2);it.w=lerp(f.w,g.w,e2);it.h=lerp(f.h,g.h,e2);
   it.bl=lerp(f.bl,g.bl,e2);it.dim=lerp(f.dim,g.dim,e2);
   it.op=g.op<f.op?(t>.08?g.op:f.op):(t>(it.fast?.05:.5)?g.op:f.op)});
  for(const id in wires){const w=wires[id],t=Math.max(0,Math.min(1,(el-w.delay)/(w.tp?itemDur+300:220)));w.p=w.tp?lerp(w.fp,w.tp,ease(t)):lerp(w.fp,0,t)}
  if(done)finish();
 }
 draw();requestAnimationFrame(step);
}

 order.forEach(it=>{

  e.style.setProperty('--bw',(bw/sc)+'px');
  e.style.filter=(it.bl>.2||it.dim<.99)?`blur(${it.bl}px) brightness(${it.dim})`:'none';
  e.style.zIndex=Math.round(20000-r.d*4)+(it.zb||0);
  e.classList.toggle('contour',it.look==='contour');e.classList.toggle('dots',it.look==='dots');
  e.classList.toggle('sel',!!it.isSel);
  const act=it.op>.5&&!moving;e.style.pointerEvents=act?'auto':'none';
  e.style.setProperty('--ow',(3/sc)+'px');
  const ti=act?0:-1;if(it.ti!==ti){it.ti=ti;e.tabIndex=ti}
 });
 /* question */
 const qp=proj(0,0,F);
 qEl.style.fontSize=(Q.size*u)+'px';qEl.classList.toggle('one',Q.size<45);
 qEl.style.transform=`translate(${qp.sx}px,${qp.sy}px) translate(-50%,-50%)`;
 qEl.style.opacity=Q.op;
 const qw=qEl.offsetWidth,qh=qEl.offsetHeight;
 /* fils */
 for(const id in wires){
  const w=wires[id],it=items[w.it];
  if(w.p<.01||(it.op<.5&&!w.frozen)){w.v.setAttribute('d','');w.h.setAttribute('d','');continue}
  let a,b;
  if(w.frozen){a=w.frozen.a;b=w.frozen.b}else{
  const r=rect(it);let ax0=qp.sx,ay0=qp.sy,bx=r.cx,by=r.cy,bw2=r.w/2,bh2=r.h/2;
  /* le trait s'arrête au bord de l'ensemble image + étiquette, jamais sous l'étiquette */
  if(!moving){let L=r.l,T=r.t,R=r.r,B=r.b,k=0;labs.forEach(l=>{if(l.it===w.it&&l.corner!=='tl'&&l.corner!=='c'&&l.el.classList.contains('on')){const q=l.el.getBoundingClientRect();L=Math.min(L,q.left);R=Math.max(R,q.right);T=Math.min(T,q.top);B=Math.max(B,q.bottom);k=1}});
   if(k){bx=(L+R)/2;by=(T+B)/2;bw2=(R-L)/2;bh2=(B-T)/2}}
  const dx=bx-ax0,dy=by-ay0;const gp=it.thumb?4*u:6*u;
  a=edge(ax0,ay0,qw/2+8*u,qh/2+6*u,dx,dy);b=edge(bx,by,bw2+gp,bh2+gp,-dx,-dy);w.last={a,b}}
  const ex=a.x+(b.x-a.x)*w.p,ey=a.y+(b.y-a.y)*w.p;
  const d=`M${a.x.toFixed(1)} ${a.y.toFixed(1)}L${ex.toFixed(1)} ${ey.toFixed(1)}`;
  w.v.setAttribute('d',d);w.h.setAttribute('d',(w.p>.98&&!moving)?d:'')
 }
 /* libellés */
 const sc=cur.name;
 labs.forEach(l=>{
  let r,vis=!moving&&l.vis(sc);
  if(l.it==='__q'){r={l:qp.sx-qw/2,r:qp.sx+qw/2,t:qp.sy-qh/2,b:qp.sy+qh/2,cx:qp.sx,w:qw,h:qh};}
  else{const it=items[l.it];if(it.op<.5)vis=false;r=rect(it);if(r.d<=120)vis=false;
}
  l.el.classList.toggle('on',vis);
  if(!vis&&!l.el.classList.contains('on')){}
  let x,y,tr='';
  switch(l.corner){
   case 'tl':x=r.l;y=r.t;break;
   case 'tlo':x=r.l;y=r.t-6*u;tr='translateY(-100%)';break;
   case 'blo':x=r.l;y=r.b+6*u;break;
   case 'bl':x=r.l;y=r.b;tr='translateY(-100%)';break;
   case 'br':x=r.r;y=r.b;tr='translate(-100%,-100%)';break;
   case 'bo':x=r.l;y=r.b;break;
   case 'c':x=r.cx;y=r.cy;tr='translate(-50%,-50%)';break;
   case 'r':x=r.r+10*u;y=r.cy;tr='translateY(-50%)';break;
   case 'qb':x=r.cx;y=r.b+16*u;tr='translateX(-50%)';break;
   case 'hl':x=r.cx;y=r.b-r.h*.14;tr='translate(-50%,-100%)';break;
  }
  if(l.wf)l.el.style.width=(r.w*l.wf)+'px';
  if(vis&&(l.corner==='bo'||l.corner==='r'||l.corner==='tl')){const ww=l.el.offsetWidth;if(x+ww>W*.97)x=W*.97-ww}
  l.el.style.transform=`translate(${x+(l.dx||0)*u}px,${y+(l.dy||0)*u}px) ${tr}`;
 });
}
function drawZL(now){
 const ok=INC&&cur.name==='n1'&&!moving&&INC.el.classList.contains('on')&&!INC.el.classList.contains('mv-g');
 ZL.forEach(l=>{
  const it=items[l.role],zel=ok&&INC.el.querySelector('[data-zone="'+l.id+'"]');
  if(!ok||!zel||it.op<.5||zel.classList.contains('mv-zs')||it.el.style.visibility!=='visible'){l.t0=0;l.v.setAttribute('d','');l.h.setAttribute('d','');return}
  if(!l.t0)l.t0=now;
  const zb=zel.getBoundingClientRect(),r=rect(it);
  let lo=r.l,hi=r.r,bot=r.b;
  const cl=labs.find(x=>x.it===l.role&&x.cls==='chip');
  if(cl&&cl.el.classList.contains('on')){const lb=cl.el.getBoundingClientRect();hi=Math.max(hi,lb.right);bot=Math.max(bot,lb.bottom)}
  let sx=zb.left+zb.width/2,sy=zb.top-6*u,tx=Math.max(lo+8*u,Math.min(sx,hi-8*u)),ty=bot+6*u;
  if(l.role==='victimes'){sx=zb.right+6*u;sy=zb.top+zb.height/2;tx=r.l-6*u;ty=r.cy}
  const p=ease(Math.min(1,(now-l.t0)/700)),ex=sx+(tx-sx)*p,ey=sy+(ty-sy)*p;
  const d=`M${sx.toFixed(1)} ${sy.toFixed(1)}L${ex.toFixed(1)} ${ey.toFixed(1)}`;
  l.v.setAttribute('d',d);l.h.setAttribute('d',p>.98?d:'');
 })}
function edge(cx,cy,hw,hh,dx,dy){const sx=Math.abs(dx)<1e-6?1e9:hw/Math.abs(dx),sy=Math.abs(dy)<1e-6?1e9:hh/Math.abs(dy),t=Math.min(sx,sy);return{x:cx+dx*t,y:cy+dy*t}}

/* ---------- interactions ---------- */
const SEQ=['n0','n1','n2','proof'];
function seqIndex(){const n=cur.name;return n==='role'?1.5:n==='n2g'?2:SEQ.indexOf(n)}
function next(){const n=cur.name;if(n==='n0')go('n1');else if(n==='n1'||n==='role')go('n2');else if(n==='n2g'||n==='n2')go('proof')}
function prev(){const n=cur.name;if(n==='zone')go(zoneBack);else if(n==='proof')go('n2');else if(n==='n2'||n==='n2g'||n==='role')go('n1');else if(n==='n1')go('n0')}
addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName==='INPUT')return;
 if(e.key==='ArrowRight'){e.preventDefault();next()}
 else if(e.key==='ArrowLeft'||e.key==='Escape'){e.preventDefault();prev()}
});
function addQuestion(txt){
 if(EXTRA)return;EXTRA=txt;posing=false;renderInc();syncZone();applyGhost();
 const M=window.Mouvement;if(M&&M.zone){M.zone('zx','silhouette');setTimeout(()=>M.zone('zx','revele'),700)}
}
function goRole(id){if(id==='inconnus'){zoneBack='n1';go('zone',ZONES[0].id);return}if(!R[id])return;if(id==='amp')go('n2');else go('role',id)}
document.addEventListener('click',e=>{
 hideTip();
 const t=e.target;
 const zg=t.closest('[data-zonego]');if(zg){zoneBack=cur.name==='proof'?'proof':'n1';go('zone',zg.dataset.zonego);return}
 const zn=t.closest('.zn[data-zone]');if(zn){if(zn.dataset.zone!=='zx'){zoneBack='n1';go('zone',zn.dataset.zone)}return}
 if(t.closest('[data-poser]')){posing=true;renderInc();return}
 const b=t.closest('[data-go]');if(b){e.preventDefault();go(b.dataset.go);return}
 const rl=t.closest('[data-goto]');if(rl){goRole(rl.dataset.goto);return}
 if(t.closest('#q')){if(cur.name==='n1')go('n0');else if(cur.name==='n0')go('n1');else go('n1');return}
 const it=t.closest('.it');
 if(it){const o=items[it.dataset.id];
  if(cur.name==='n1'&&o.role){goRole(o.role);return}
  if((cur.name==='n2')&&o.tile){sel=G[o.tile.g].id;go('n2',null,true);emitEtat('role',{id:G[o.tile.g].id,pile:true});return}
 }
});
const tip=$('#tip');
function hideTip(){tip.classList.remove('on')}
function segHit(a,b,r){let t0=0,t1=1;const dx=b.x-a.x,dy=b.y-a.y;
 for(const [pp,qq] of [[-dx,a.x-r.left],[dx,r.right-a.x],[-dy,a.y-r.top],[dy,r.bottom-a.y]]){
  if(pp===0){if(qq<0)return false}else{const t=qq/pp;if(pp<0){if(t>t1)return false;t0=Math.max(t0,t)}else{if(t<t0)return false;t1=Math.min(t1,t)}}}
 return t0<=t1}
function showTip(txt,x,y,target){
 tip.textContent=txt;tip.classList.add('on');
 const w=tip.offsetWidth,h=tip.offsetHeight,M=10;
 const obs=[];
 order.forEach(it=>{const e=it.el;if(it.ghost||e===target||it.op<.5||e.style.visibility==='hidden')return;obs.push(e.getBoundingClientRect())});
 labs.forEach(l=>{if(l.el.classList.contains('on'))obs.push(l.el.getBoundingClientRect())});
 ['#panel','#proof','#zone','#banner','#sub','#logo','#bc','#rail','#fict'].forEach(q=>{const e=$(q);if(e&&!e.classList.contains('off'))obs.push(e.getBoundingClientRect())});
 const tid=target&&target.dataset.id,tr0=tid&&items[tid]&&items[tid].role;
 const segs=[];for(const id in wires){const wr=wires[id];if(wr.p>.5&&!moving&&wr.last&&wr.it!==tid&&!(tr0&&(wr.id===tr0||(tr0==='amp'&&wr.id==='amp'))))segs.push(wr.last)}
 const tr=target?target.getBoundingClientRect():{left:x,right:x,top:y,bottom:y,width:0,height:0};
 const cy=tr.top+(tr.height-h)/2,cx=tr.left+(tr.width-w)/2;
 const C=target?[[tr.right+M,cy],[tr.left-M-w,cy],[cx,tr.bottom+M],[cx,tr.top-M-h],[tr.right+M,tr.top],[tr.left-M-w,tr.top]]
  :[[x+18,y+22],[x-w-18,y+22],[x+18,y-h-22],[x-w-18,y-h-22],[x-w/2,y+26],[x-w/2,y-h-26]];
 let best=null;
 for(const [px0,py0] of C){
  const px=Math.max(8,Math.min(px0,W-w-8)),py=Math.max(8,Math.min(py0,H-h-8));
  const r={left:px,right:px+w,top:py,bottom:py+h};let sc=Math.abs(px-px0)+Math.abs(py-py0);
  for(const o of obs)if(r.left<o.right+4&&r.right>o.left-4&&r.top<o.bottom+4&&r.bottom>o.top-4)sc+=1000;
  for(const sg of segs)if(segHit(sg.a,sg.b,r))sc+=600;
  if(!best||sc<best.sc)best={sc,px,py};
  if(sc===0)break;
 }
 tip.style.transform=`translate(${best.px}px,${best.py}px)`;
}
document.addEventListener('mousemove',e=>{
 const t=e.target.closest&&e.target.closest('[data-tip]');
 if(t&&!moving&&!t.classList.contains('off')){
  let txt=t.dataset.tip;
  if(t.classList.contains('it')){const o=items[t.dataset.id];if(o&&o.tile&&cur.name==='n2')txt=G[o.tile.g].tipS;}
  showTip(txt,e.clientX,e.clientY,t.classList.contains('it')?t:null);
 }else hideTip();
});
document.addEventListener('mousedown',hideTip,true);
document.documentElement.addEventListener('mouseleave',hideTip);
addEventListener('blur',hideTip);
document.addEventListener('keydown',e=>{
 if((e.key==='Enter'||e.key===' ')&&e.target.classList&&(e.target.classList.contains('it')||e.target.id==='q')){e.preventDefault();e.target.click()}
});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>dispatchEvent(new Event('resize')));
addEventListener('resize',()=>{size();if(INC){syncZone();applyGhost()}if(!S)return;if(moving){pendingResize=true;return}go(cur.name,cur.arg,true)});

/* ---------- démarrage ---------- */
function fromHash(){
 const h=location.hash.replace('#','');
 if(h.startsWith('zone-')&&ZONES.some(z=>z.id===h.slice(5)))return['zone',h.slice(5)];
 if(h==='dossier-inconnus')return['zone',ZONES[0].id];
 if(h==='niveau0')return['n0'];if(h==='niveau1')return['n1'];if(h==='niveau2')return['n2'];if(h==='preuve')return['proof'];
 if(h.startsWith('dossier-')&&R[h.slice(8)])return h.slice(8)==='amp'?['n2']:['role',h.slice(8)];
 return null;
}
const QS=new URLSearchParams(location.search);if(QS.get('phase'))fixedPhase=+QS.get('phase');
const st=fromHash();
if(st){go(st[0],st[1],true)}
else{go('n0',null,true);setTimeout(()=>go('n1'),900)}
addEventListener('hashchange',()=>{if(location.hash===selfHash)return;const s=fromHash();if(s&&(s[0]!==cur.name||s[1]!==cur.arg))go(s[0],s[1])});
if(QS.get('auto')){const [n,d]=QS.get('auto').split('@');setTimeout(()=>go(n==='role'?'role':n,n==='role'?'experts':null),+d||100)}
if(QS.get('hover'))setTimeout(()=>{const it=items[QS.get('hover')];if(!it)return;const r=it.el.getBoundingClientRect();showTip(it.tip,r.left+r.width/2,r.top+r.height/2,it.el)},400);
if(window.ResizeObserver&&INC)new ResizeObserver(()=>{syncZone();applyGhost()}).observe(INC.el);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{syncZone();applyGhost()});
requestAnimationFrame(step);
})();
